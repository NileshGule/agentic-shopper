openapi: 3.0.3
info:
  title: List Generator Agent API
  description: AI-powered shopping list generation based on frequency analysis
  version: 1.0.0

servers:
  - url: http://localhost:5004/api/v1
    description: Local development
  - url: https://list-generator-agent.azurecontainerapps.io/api/v1
    description: Azure Container Apps

tags:
  - name: Lists
    description: Shopping list generation

paths:
  /lists/generate:
    post:
      summary: Generate shopping list based on purchase frequencies
      tags: [Lists]
      operationId: generateList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - familyId
              properties:
                familyId:
                  type: string
                  format: uuid
                includeDueItems:
                  type: boolean
                  default: true
                  description: Include items due this week
                includeOverdueItems:
                  type: boolean
                  default: true
                  description: Include overdue items
                includeUpcomingItems:
                  type: boolean
                  default: false
                  description: Include items due in 3+ days
                categoryFilter:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Filter by specific categories
      responses:
        '200':
          description: Shopping list generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - BearerAuth: []

  /lists/suggestions:
    get:
      summary: Get product suggestions without creating a list
      tags: [Lists]
      operationId: getSuggestions
      parameters:
        - name: familyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  overdueCount:
                    type: integer
                  dueThisWeekCount:
                    type: integer
                  upcomingCount:
                    type: integer
                  suggestions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductSuggestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - BearerAuth: []

components:
  schemas:
    GeneratedList:
      type: object
      required:
        - items
        - metadata
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ListItem'
        metadata:
          type: object
          properties:
            totalItems:
              type: integer
            overdueCount:
              type: integer
            dueThisWeekCount:
              type: integer
            upcomingCount:
              type: integer
            categoriesIncluded:
              type: array
              items:
                type: string
            generatedDate:
              type: string
              format: date-time

    ListItem:
      type: object
      required:
        - productId
        - productName
        - urgency
        - quantity
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
        categoryName:
          type: string
        urgency:
          type: string
          enum: [Overdue, DueThisWeek, Upcoming]
        quantity:
          type: number
          format: decimal
          default: 1
        lastPurchased:
          type: string
          format: date
        frequency:
          type: string
          enum: [Weekly, Fortnightly, Monthly, Quarterly, Annually, Occasional]
        daysSinceLastPurchase:
          type: integer
        notes:
          type: string
          description: User notes from product metadata

    ProductSuggestion:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
        categoryName:
          type: string
        urgency:
          type: string
          enum: [Overdue, DueThisWeek, Upcoming]
        recommendedQuantity:
          type: number
          format: decimal
        reason:
          type: string
          example: "Last purchased 8 days ago, typically purchased weekly"

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
