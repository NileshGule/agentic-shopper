apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: agentic-shopper
  labels:
    app: coordinator
    component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
        component: backend
    spec:
      containers:
      - name: coordinator
        image: ghcr.io/nileshgule/agentic-shopper-coordinator:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        - containerPort: 443
          name: https
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: agentic-shopper-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          value: "http://+:80"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: agentic-shopper-secrets
              key: ConnectionStrings__DefaultConnection
        - name: JwtSettings__SecretKey
          valueFrom:
            secretKeyRef:
              name: agentic-shopper-secrets
              key: JwtSettings__SecretKey
        - name: JwtSettings__Issuer
          valueFrom:
            configMapKeyRef:
              name: agentic-shopper-config
              key: JwtSettings__Issuer
        - name: JwtSettings__Audience
          valueFrom:
            configMapKeyRef:
              name: agentic-shopper-config
              key: JwtSettings__Audience
        - name: JwtSettings__ExpiresInMinutes
          valueFrom:
            configMapKeyRef:
              name: agentic-shopper-config
              key: JwtSettings__ExpiresInMinutes
        - name: LLM__Provider
          valueFrom:
            configMapKeyRef:
              name: agentic-shopper-config
              key: LLM__Provider
        - name: LLM__Endpoint
          valueFrom:
            secretKeyRef:
              name: agentic-shopper-secrets
              key: LLM__Endpoint
        - name: LLM__ApiKey
          valueFrom:
            secretKeyRef:
              name: agentic-shopper-secrets
              key: LLM__ApiKey
        - name: AzureDocumentIntelligence__Endpoint
          valueFrom:
            secretKeyRef:
              name: agentic-shopper-secrets
              key: AzureDocumentIntelligence__Endpoint
        - name: AzureDocumentIntelligence__ApiKey
          valueFrom:
            secretKeyRef:
              name: agentic-shopper-secrets
              key: AzureDocumentIntelligence__ApiKey
        - name: AzureStorage__ConnectionString
          valueFrom:
            secretKeyRef:
              name: agentic-shopper-secrets
              key: AzureStorage__ConnectionString
        - name: AzureStorage__ContainerName
          valueFrom:
            configMapKeyRef:
              name: agentic-shopper-config
              key: AzureStorage__ContainerName
        - name: Redis__ConnectionString
          valueFrom:
            secretKeyRef:
              name: agentic-shopper-secrets
              key: Redis__ConnectionString
        - name: Redis__InstanceName
          valueFrom:
            configMapKeyRef:
              name: agentic-shopper-config
              key: Redis__InstanceName
        - name: Cors__AllowedOrigins
          valueFrom:
            configMapKeyRef:
              name: agentic-shopper-config
              key: Cors__AllowedOrigins
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator-service
  namespace: agentic-shopper
  labels:
    app: coordinator
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
  selector:
    app: coordinator
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coordinator-hpa
  namespace: agentic-shopper
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coordinator
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
