name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'

env:
  NODE_VERSION: '20.x'
  FRONTEND_PATH: 'frontend'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json
          
      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm ci
        
      - name: Run ESLint
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm run lint
        continue-on-error: true
        
      - name: Run Prettier check
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npx prettier --check "src/**/*.{ts,tsx,css}"
        continue-on-error: true
        
      - name: Run tests
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm test -- --coverage
        continue-on-error: true
        if: false  # Enable when tests are implemented
        
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ${{ env.FRONTEND_PATH }}/coverage
          flags: frontend
          fail_ci_if_error: false
          
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json
          
      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm ci
        
      - name: Build production bundle
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm run build
        env:
          NODE_ENV: production
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.FRONTEND_PATH }}/dist
          retention-days: 7
          
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Run npm audit
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm audit --audit-level=moderate
        continue-on-error: true
        
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        if: false  # Enable when Snyk token is configured
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.FRONTEND_PATH }}/dist
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/agentic-shopper-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Create Dockerfile for frontend
        working-directory: ${{ env.FRONTEND_PATH }}
        run: |
          cat > Dockerfile.production <<'EOF'
          FROM nginx:alpine
          
          # Copy nginx configuration
          COPY nginx.conf /etc/nginx/conf.d/default.conf
          
          # Copy build artifacts
          COPY dist /usr/share/nginx/html
          
          # Expose port 80
          EXPOSE 80
          
          # Health check
          HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \
            CMD wget --quiet --tries=1 --spider http://localhost/ || exit 1
          
          CMD ["nginx", "-g", "daemon off;"]
          EOF
          
      - name: Create nginx configuration
        working-directory: ${{ env.FRONTEND_PATH }}
        run: |
          cat > nginx.conf <<'EOF'
          server {
              listen 80;
              server_name localhost;
              root /usr/share/nginx/html;
              index index.html;
              
              location / {
                  try_files $uri $uri/ /index.html;
              }
              
              location /api {
                  proxy_pass http://agentic-shopper-coordinator:8080;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }
              
              location /hubs {
                  proxy_pass http://agentic-shopper-coordinator:8080;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "Upgrade";
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }
              
              gzip on;
              gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
              gzip_min_length 1000;
          }
          EOF
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.FRONTEND_PATH }}
          file: ${{ env.FRONTEND_PATH }}/Dockerfile.production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: https://dev.agentic-shopper.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to Azure Static Web Apps (Development)
        run: |
          echo "Deploying to Azure Static Web Apps - Development environment"
          echo "This step requires Azure credentials and Static Web Apps configuration"
          # az staticwebapp update \
          #   --name agentic-shopper-frontend-dev \
          #   --resource-group agentic-shopper-dev
          
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.agentic-shopper.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to Azure Static Web Apps (Staging)
        run: |
          echo "Deploying to Azure Static Web Apps - Staging environment"
          echo "This step requires Azure credentials and Static Web Apps configuration"
          
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://agentic-shopper.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to Azure Static Web Apps (Production)
        run: |
          echo "Deploying to Azure Static Web Apps - Production environment"
          echo "This step requires Azure credentials and Static Web Apps configuration"
          # Uncomment and configure when ready for production:
          # az staticwebapp update \
          #   --name agentic-shopper-frontend-prod \
          #   --resource-group agentic-shopper-prod
